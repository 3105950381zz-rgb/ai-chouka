<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI小白如何用AI变现 · 抽卡小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg1: #17110c;
    --bg2: #2a1c10;
    --gold: #d9a95c;
    --gold-light: #f0cf8b;
    --cream: #f5ead6;
    --muted: #b6a183;
    --card-bg: #fff8ea;
    --card-text: #3a2a18;
  }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg1));
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow: hidden;
    user-select: none;
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeDown .8s ease both;
  }
  .header .sub {
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .header h1 {
    font-size: clamp(24px, 4.5vw, 46px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .hint {
    margin-top: 12px;
    font-size: clamp(12px, 1.6vw, 15px);
    color: var(--muted);
  }

  /* 进度 */
  .progress {
    font-size: clamp(13px, 1.8vw, 17px);
    color: var(--muted);
    margin-bottom: 18px;
    letter-spacing: 1px;
  }
  .progress b { color: var(--gold-light); font-size: 1.25em; }

  /* 舞台：放卡片 */
  .stage {
    position: relative;
    width: min(560px, 88vw);
    height: clamp(300px, 46vh, 420px);
    perspective: 1400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: relative;
    width: min(500px, 82vw);
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.34, 1.3, .5, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 4vw, 40px);
  }

  /* 牌背 */
  .card-back {
    background:
      radial-gradient(circle at 50% 30%, #3a2a18 0%, #22160c 70%);
    border: 2px solid var(--gold);
  }
  .card-back .logo {
    font-size: clamp(34px, 6vw, 60px);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 4px;
    text-shadow: 0 0 24px rgba(217,169,92,.45);
  }
  .card-back .logo-sub {
    margin-top: 12px;
    font-size: clamp(11px, 1.6vw, 14px);
    letter-spacing: 3px;
    color: var(--muted);
  }
  .card-back .tap {
    position: absolute;
    bottom: 26px;
    font-size: clamp(12px, 1.6vw, 15px);
    color: var(--gold);
    opacity: .85;
    animation: pulse 1.6s ease infinite;
  }

  /* 牌面（问题） */
  .card-front {
    transform: rotateY(180deg);
    background: var(--card-bg);
    color: var(--card-text);
    border: 2px solid var(--gold);
  }
  .card-front .q-label {
    font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 18px;
  }
  .card-front .q {
    font-size: clamp(19px, 3.2vw, 30px);
    font-weight: 800;
    line-height: 1.5;
    text-align: center;
  }
  .card-front .q-foot {
    margin-top: 22px;
    font-size: clamp(12px, 1.7vw, 15px);
    color: var(--muted);
  }

  /* 按钮组 */
  .controls {
    display: flex;
    gap: 14px;
    margin-top: 26px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    font-family: inherit;
    font-size: clamp(14px, 1.8vw, 17px);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 13px 30px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform .15s, opacity .15s, box-shadow .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color: #2a1a08;
    box-shadow: 0 8px 24px rgba(217,169,92,.35);
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(182,161,131,.45);
  }
  .btn:hover { opacity: .92; box-shadow: 0 10px 30px rgba(217,169,92,.45); }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

  /* 全部抽完提示 */
  .done {
    display: none;
    text-align: center;
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 800;
    color: var(--gold-light);
    line-height: 1.6;
  }
  .done .small { display:block; margin-top: 14px; font-size: clamp(13px, 1.7vw, 16px); font-weight: 500; color: var(--muted); }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px);} to { opacity:1; transform:none;} }
  @keyframes pulse { 0%,100%{opacity:.6;} 50%{opacity:1;} }
  @keyframes popIn { 0%{ opacity:0; transform: scale(.85);} 60%{ transform: scale(1.05);} 100%{ opacity:1; transform: scale(1);} }
  .card-front .q, .card-front .q-label, .card-front .q-foot { animation: popIn .5s ease both; }
</style>
</head>
<body>

  <div class="header">
    <div class="sub">展科 · 新媒体 × AI</div>
    <h1>AI小白如何用AI变现</h1>
    <div class="hint">抽一张卡，说说你的答案 —— 大家边喝茶边聊</div>
  </div>

  <div class="progress">已抽 <b id="cur">0</b> / <b id="total">10</b></div>

  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="card-face card-back">
        <div class="logo">AI 变现局</div>
        <div class="logo-sub">8.18 · 茶话会</div>
        <div class="tap">点我抽牌</div>
      </div>
      <div class="card-face card-front">
        <div class="q-label">抽到这张的朋友，请回答</div>
        <div class="q" id="qText"></div>
        <div class="q-foot" id="qFoot">答完可以把话题抛给下一位</div>
      </div>
    </div>
  </div>

  <div class="done" id="done">
    十张卡都抽完啦 🍵
    <span class="small">今天聊的话题，可能就藏在这些答案里</span>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnDraw">抽一张</button>
    <button class="btn btn-ghost" id="btnReset">重新洗牌</button>
  </div>

<script>
  // 卡片内容 —— 关于使用AI的互动问题（贴合「变现」主题）
  const CARDS = [
    "你手机里有几个AI软件？哪个用起来最惊喜？",
    "你最近一次用AI，是帮你干了件什么事？",
    "刷到过AI做的视频或图片吗？有没有被惊艳到？",
    "如果让AI帮你搞定一件最烦的事，那会是什么事？",
    "你有没有想过，用AI帮自己多赚点钱？",
    "你觉得AI会抢你饭碗，还是帮你？",
    "你身边有没有人，用AI混得不错的？",
    "如果每天给你一小时学AI，你最想学什么？",
    "如果现在就能多一份副业收入，你最想先试哪个方向？",
    "你心里最大的疑问：AI到底能不能真的赚到钱？"
  ];

  const cardEl = document.getElementById('card');
  const qText = document.getElementById('qText');
  const qFoot = document.getElementById('qFoot');
  const curEl = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const doneEl = document.getElementById('done');
  const btnDraw = document.getElementById('btnDraw');
  const btnReset = document.getElementById('btnReset');

  let pool = [];
  let flipped = false;
  let animating = false;

  totalEl.textContent = CARDS.length;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function initPool() { pool = shuffle([...CARDS]); }

  function updateProgress() { curEl.textContent = CARDS.length - pool.length; }

  function showQuestion(text) {
    qText.textContent = text;
    // 重新触发一次弹入动画
    qText.style.animation = 'none';
    void qText.offsetHeight;
    qText.style.animation = '';
  }

  function showDone() {
    cardEl.style.display = 'none';
    doneEl.style.display = 'block';
    btnDraw.disabled = true;
    btnDraw.textContent = '已抽完';
  }

  // 核心抽卡逻辑
  function draw() {
    if (animating) return;
    if (pool.length === 0) { showDone(); return; }

    if (!flipped) {
      // 牌背 → 翻开这张
      const item = pool.pop();
      showQuestion(item);
      cardEl.classList.add('flipped');
      flipped = true;
      btnDraw.textContent = '下一张';
      updateProgress();
    } else {
      // 已翻开 → 翻回背面，下一张
      animating = true;
      cardEl.classList.remove('flipped');
      flipped = false;
      btnDraw.textContent = '抽一张';
      setTimeout(() => {
        if (pool.length === 0) {
          showDone();
          animating = false;
          return;
        }
        const item = pool.pop();
        showQuestion(item);
        cardEl.classList.add('flipped');
        flipped = true;
        btnDraw.textContent = '下一张';
        updateProgress();
        animating = false;
      }, 480);
    }
  }

  function reset() {
    initPool();
    updateProgress();
    cardEl.style.display = '';
    doneEl.style.display = 'none';
    cardEl.classList.remove('flipped');
    flipped = false;
    animating = false;
    btnDraw.disabled = false;
    btnDraw.textContent = '抽一张';
  }

  cardEl.addEventListener('click', draw);
  btnDraw.addEventListener('click', draw);
  btnReset.addEventListener('click', reset);

  initPool();
  updateProgress();
</script>
</body>
</html>
