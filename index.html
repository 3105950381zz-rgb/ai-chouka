<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI小白如何用AI变现 · 抽卡小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg1: #17110c;
    --bg2: #2a1c10;
    --gold: #d9a95c;
    --gold-light: #f0cf8b;
    --cream: #f5ead6;
    --muted: #b6a183;
    --card-bg: #fff8ea;
    --card-text: #3a2a18;
  }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg1));
    color: var(--cream);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: clamp(14px, 3vw, 32px);
    user-select: none; overflow-x: hidden;
  }

  /* 背景漂浮光点 */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(70px); opacity: .3;
    animation: drift 16s ease-in-out infinite;
  }
  .o1 { width: 300px; height: 300px; background: #c98a3f; top: -80px; left: -80px; }
  .o2 { width: 240px; height: 240px; background: #8a5a2a; bottom: -60px; right: -60px; animation-delay: -6s; }
  .o3 { width: 180px; height: 180px; background: #d9a95c; top: 38%; left: -90px; animation-delay: -11s; }
  .o4 { width: 200px; height: 200px; background: #7a4a1f; bottom: 8%; right: -80px; animation-delay: -3s; }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,30px) scale(1.18); } }

  .header, .progress, .grid, .controls { position: relative; z-index: 1; }

  /* 顶部标题 */
  .header { text-align: center; margin-bottom: 18px; animation: fadeDown .8s ease both; }
  .header .sub {
    font-size: clamp(11px, 1.6vw, 15px); letter-spacing: 4px; color: var(--gold);
    margin-bottom: 8px; font-weight: 600;
  }
  .header h1 {
    font-size: clamp(22px, 3.6vw, 42px); font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(110deg, var(--gold) 0%, var(--gold-light) 30%, #fff2cf 50%, var(--gold-light) 70%, var(--gold) 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }
  .header .hint {
    margin-top: 8px; font-size: clamp(12px, 1.5vw, 14px); color: var(--muted);
  }

  /* 进度条 */
  .progress {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: clamp(14px, 2.5vw, 24px);
  }
  .progress .text { font-size: clamp(13px, 1.7vw, 16px); color: var(--muted); letter-spacing: 1px; }
  .progress .text b { color: var(--gold-light); font-size: 1.3em; }
  .bar {
    width: clamp(120px, 22vw, 260px); height: 8px; border-radius: 99px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width .5s cubic-bezier(.3,1,.4,1);
    box-shadow: 0 0 10px rgba(217,169,92,.6);
  }

  /* 卡牌区域 */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 2vw, 26px);
    width: min(1200px, 96vw);
    perspective: 1600px;
  }

  .card {
    position: relative; aspect-ratio: 4 / 5; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: cardIn .6s cubic-bezier(.2, .9, .4, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(.86); }
    to { opacity: 1; transform: none; }
  }

  .card-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.3, 1.2, .5, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: clamp(10px, 1.6vw, 18px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(12px, 2.2vw, 28px);
    box-shadow: 0 18px 34px rgba(0,0,0,.5);
  }

  /* 牌背：无序号，金色问号 */
  .back {
    background: radial-gradient(circle at 50% 28%, #3a2a18 0%, #22160c 72%);
    border: 2px solid var(--gold);
    transition: box-shadow .3s, transform .3s;
  }
  .back::after {
    content: ""; position: absolute; inset: 8%;
    border: 1px dashed rgba(217,169,92,.4);
    border-radius: inherit; pointer-events: none;
  }
  .back .logo {
    font-size: clamp(11px, 1.5vw, 16px); font-weight: 700; letter-spacing: 3px;
    color: var(--gold); opacity: .85;
  }
  .back .mark {
    margin-top: clamp(6px, 1vw, 12px);
    font-size: clamp(34px, 5vw, 64px); font-weight: 900; line-height: 1;
    color: var(--gold-light);
    text-shadow: 0 0 24px rgba(217,169,92,.55);
    animation: markPulse 3s ease-in-out infinite;
  }
  @keyframes markPulse { 0%,100% { opacity: .95; transform: scale(1); } 50% { opacity: .6; transform: scale(1.06); } }

  /* 悬停微动 */
  .card:hover:not(.flipped) .card-inner { transition-duration: .35s; }
  .card:hover:not(.flipped) .back { box-shadow: 0 0 30px rgba(217,169,92,.55); }
  .card:hover:not(.flipped) { transform: translateY(-4px); }

  /* 翻开光晕 */
  .card::after {
    content: ""; position: absolute; inset: -5px; border-radius: inherit;
    border: 2px solid rgba(240,207,139,.85);
    opacity: 0; pointer-events: none; z-index: 2;
  }
  .card.flipped::after { animation: ring .85s ease-out; }
  @keyframes ring {
    0% { opacity: .9; transform: scale(.8); }
    100% { opacity: 0; transform: scale(1.4); }
  }

  /* 牌面（问题） */
  .front {
    transform: rotateY(180deg);
    background: linear-gradient(180deg, #fffdf5 0%, #f7ecd6 100%);
    border: 2px solid var(--gold);
    color: var(--card-text);
  }
  .front .q-label {
    font-size: clamp(8px, 1vw, 11px); letter-spacing: 2px;
    color: var(--gold); font-weight: 700; margin-bottom: clamp(10px, 1.6vw, 18px);
    text-align: center;
  }
  .front .q {
    font-size: clamp(12px, 2.8vmin, 24px);
    font-weight: 800; line-height: 1.65; text-align: center;
  }
  .front .q span {
    display: inline-block; opacity: 0;
    animation: charIn .4s ease forwards;
  }
  /* 追问区 */
  .sub-q {
    margin-top: clamp(12px, 1.8vw, 20px);
    width: 100%;
    border-top: 1px dashed rgba(217,169,92,.45);
    padding-top: clamp(9px, 1.4vw, 14px);
    text-align: center;
  }
  .sub-q-title {
    font-size: clamp(7px, 0.9vw, 10px);
    letter-spacing: 2px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 7px;
  }
  .sub-q-item {
    font-size: clamp(9px, 1.7vmin, 13px);
    line-height: 1.65;
    color: #8a6a3a;
    font-weight: 600;
  }
  .sub-q-item + .sub-q-item { margin-top: 6px; }
  @keyframes charIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* 结束提示 */
  .done {
    display: none; text-align: center; margin-top: 16px;
    font-size: clamp(18px, 2.6vw, 28px); font-weight: 800; color: var(--gold-light);
    animation: popIn .5s ease both; position: relative; z-index: 2;
  }
  .done .small { display: block; margin-top: 8px; font-size: clamp(12px, 1.5vw, 15px); font-weight: 500; color: var(--muted); }

  /* 按钮 */
  .controls { margin-top: clamp(14px, 2.5vw, 26px); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit; font-size: clamp(13px, 1.7vw, 16px); font-weight: 700; letter-spacing: 1px;
    padding: 11px 26px; border-radius: 999px; border: none; cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .15s;
  }
  .btn:active { transform: scale(.95); }
  .btn-primary {
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color: #2a1a08; box-shadow: 0 8px 24px rgba(217,169,92,.35);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(217,169,92,.5); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid rgba(182,161,131,.45); }
  .btn-ghost:hover { color: var(--gold-light); border-color: var(--gold); }

  /* 撒花粒子 */
  .confetti {
    position: fixed; top: -12px; width: 9px; height: 9px;
    background: var(--gold-light); border-radius: 2px; z-index: 50;
    pointer-events: none; opacity: 0;
    animation: confettiFall ease-in forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(108vh) rotate(720deg); }
  }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px);} to { opacity:1; transform:none;} }
  @keyframes popIn { 0%{ opacity:0; transform: scale(.85);} 60%{ transform: scale(1.05);} 100%{ opacity:1; transform: scale(1);} }

  /* 手机竖屏：2 列，问题放大 */
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .front .q { font-size: clamp(12px, 3.6vw, 16px); }
    .sub-q-item { font-size: clamp(9px, 3vw, 11px); }
    .confetti { width: 7px; height: 7px; }
  }
</style>
</head>
<body>

  <div class="bg">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="orb o4"></span>
  </div>

  <div class="header">
    <div class="sub">展科 · 新媒体 × AI</div>
    <h1>AI小白如何用AI变现</h1>
    <div class="hint">每人点一张牌，翻开说说你的答案 —— 大家边喝茶边聊</div>
  </div>

  <div class="progress">
    <span class="text">已翻开 <b id="cur">0</b> / <b id="total">10</b></span>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="done" id="done">
    六张牌都翻完啦 🍵
    <span class="small">今天聊的话题，可能就藏在这些答案里</span>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnReset">重新开始</button>
  </div>

<script>
  const CARDS = [
    { q: "如果让AI帮你搞定一件最烦的事，会是什么事？", s: ["这件事现在要花你多少时间？", "搞定它对你意味着什么？"] },
    { q: "你有没有想过，用AI帮自己多赚点钱？", s: ["你觉得哪种方式最靠谱？", "接单、做内容、还是用在自己生意上？"] },
    { q: "你觉得AI会抢你饭碗，还是帮你？", s: ["你工作里最怕被替代的是哪块？", "最希望AI帮你的是哪块？"] },
    { q: "你身边有没有人，用AI混得不错的？", s: ["他具体是做什么的？", "你最羡慕他哪一点？"] },
    { q: "如果现在就能多一份副业收入，你最想先试哪个方向？", s: ["为什么选这个方向？", "你现在有这方面的基础吗？"] },
    { q: "你心里最大的疑问：AI到底能不能真的赚到钱？", s: ["你见过身边真实赚到钱的例子吗？", "卡住你的，是方法还是别的？"] }
  ];

  const grid = document.getElementById('grid');
  const curEl = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const barEl = document.getElementById('bar');
  const doneEl = document.getElementById('done');

  totalEl.textContent = CARDS.length;
  let flippedCount = 0;

  function playFlip() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  }

  function updateProgress() {
    curEl.textContent = flippedCount;
    barEl.style.width = (flippedCount / CARDS.length * 100) + '%';
    doneEl.style.display = flippedCount === CARDS.length ? 'block' : 'none';
    if (flippedCount === CARDS.length) spawnConfetti();
  }

  // 主问题逐字浮现 + 追问填入
  function setQuestion(card, item) {
    const qEl = card.querySelector('.q');
    const chars = Array.from(item.q);
    qEl.innerHTML = chars.map((ch, i) =>
      `<span style="animation-delay:${(0.3 + i * 0.03).toFixed(2)}s">${ch === ' ' ? '&nbsp;' : ch}</span>`
    ).join('');
    const subs = card.querySelectorAll('.sub-q-item');
    item.s.forEach((txt, i) => {
      if (subs[i]) subs[i].textContent = txt;
    });
    for (let i = item.s.length; i < subs.length; i++) {
      if (subs[i]) subs[i].textContent = '';
    }
  }

  function buildCards() {
    grid.innerHTML = '';
    flippedCount = 0;
    CARDS.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.idx = i;
      card.style.animationDelay = (i % 5 * 0.08 + Math.floor(i / 5) * 0.15) + 's';
      card.innerHTML = `
        <div class="card-inner">
          <div class="face back">
            <div class="logo">AI 变现局</div>
            <div class="mark">?</div>
          </div>
          <div class="face front">
            <div class="q-label">抽到这张的朋友，请回答</div>
            <div class="q"></div>
            <div class="sub-q">
              <div class="sub-q-title">可以接着聊聊</div>
              <div class="sub-q-item i1"></div>
              <div class="sub-q-item i2"></div>
            </div>
          </div>
        </div>`;
      card.addEventListener('click', () => flipCard(card, item));
      grid.appendChild(card);
    });
    updateProgress();
  }

  function flipCard(card, item) {
    if (card.classList.contains('flipped')) return;
    card.classList.add('flipped');
    flippedCount++;
    playFlip();
    setQuestion(card, item);
    updateProgress();
  }

  function shuffle() {
    const cards = [...grid.children];
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    cards.forEach(c => grid.appendChild(c));
  }

  // 撒花
  function spawnConfetti() {
    const colors = ['#f0cf8b', '#d9a95c', '#ffe9b0', '#c98a3f'];
    for (let i = 0; i < 50; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      s.style.animationDelay = (Math.random() * 0.8) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3600);
    }
  }

  function reset() {
    flippedCount = 0;
    grid.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
    updateProgress();
    shuffle();
    playFlip();
  }

  document.getElementById('btnReset').addEventListener('click', reset);
  buildCards();
</script>
</body>
</html>
