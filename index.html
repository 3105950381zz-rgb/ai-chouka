<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI小白如何用AI变现 · 抽卡小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg1: #17110c;
    --bg2: #2a1c10;
    --gold: #d9a95c;
    --gold-light: #f0cf8b;
    --cream: #f5ead6;
    --muted: #b6a183;
    --card-bg: #fff8ea;
    --card-text: #3a2a18;
  }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg1));
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: clamp(14px, 3vw, 32px);
    user-select: none;
  }

  /* 顶部标题 */
  .header { text-align: center; margin-bottom: 18px; animation: fadeDown .8s ease both; }
  .header .sub {
    font-size: clamp(11px, 1.6vw, 15px); letter-spacing: 4px; color: var(--gold);
    margin-bottom: 8px; font-weight: 600;
  }
  .header h1 {
    font-size: clamp(22px, 3.6vw, 42px); font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header .hint {
    margin-top: 8px; font-size: clamp(12px, 1.5vw, 14px); color: var(--muted);
  }

  /* 进度条 */
  .progress {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: clamp(14px, 2.5vw, 24px);
  }
  .progress .text { font-size: clamp(13px, 1.7vw, 16px); color: var(--muted); letter-spacing: 1px; }
  .progress .text b { color: var(--gold-light); font-size: 1.3em; }
  .bar {
    width: clamp(120px, 22vw, 260px); height: 8px; border-radius: 99px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width .5s cubic-bezier(.3,1,.4,1);
  }

  /* 卡牌区域 */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(8px, 1.6vw, 18px);
    width: min(1200px, 96vw);
    perspective: 1600px;
  }

  .card {
    position: relative;
    aspect-ratio: 4 / 5;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.3, 1.2, .5, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: clamp(10px, 1.6vw, 18px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(8px, 1.4vw, 18px);
    box-shadow: 0 18px 34px rgba(0,0,0,.5);
  }

  /* 牌背 */
  .back {
    background:
      radial-gradient(circle at 50% 28%, #3a2a18 0%, #22160c 72%);
    border: 2px solid var(--gold);
    transition: box-shadow .3s;
  }
  .back::after {
    content: ""; position: absolute; inset: 8%;
    border: 1px dashed rgba(217,169,92,.4);
    border-radius: inherit; pointer-events: none;
  }
  .back .idx {
    font-size: clamp(13px, 1.7vw, 20px); font-weight: 900;
    color: var(--gold); opacity: .8;
  }
  .back .logo {
    font-size: clamp(14px, 1.9vw, 24px); font-weight: 800;
    color: var(--gold-light); letter-spacing: 2px; margin-top: 4px;
    text-shadow: 0 0 18px rgba(217,169,92,.4);
  }
  /* 未翻开悬停 / 可抽提示 */
  .card:hover:not(.flipped) .back { box-shadow: 0 0 26px rgba(217,169,92,.5); transform: translateY(-3px); }
  .card:hover:not(.flipped) .card-inner { transition-duration: .35s; }
  .card.flipped .card-inner:hover { transform: rotateY(180deg) translateY(-4px); }

  /* 牌面（问题） */
  .front {
    transform: rotateY(180deg);
    background:
      linear-gradient(180deg, #fffdf5 0%, #f7ecd6 100%);
    border: 2px solid var(--gold);
    color: var(--card-text);
  }
  .front.flash { box-shadow: 0 0 40px rgba(240,207,139,.85); }
  .front .q-label {
    font-size: clamp(8px, 1vw, 11px); letter-spacing: 2px;
    color: var(--gold); font-weight: 700; margin-bottom: clamp(6px, 1vw, 12px);
    text-align: center;
  }
  .front .q {
    font-size: clamp(11px, 2.5vmin, 22px);
    font-weight: 800; line-height: 1.45; text-align: center;
    overflow: hidden;
  }
  .front .q-no {
    margin-top: auto; padding-top: 8px;
    font-size: clamp(8px, 1vw, 11px); color: var(--muted); letter-spacing: 2px;
  }

  /* 结束提示 */
  .done {
    display: none; text-align: center; margin-top: 16px;
    font-size: clamp(18px, 2.6vw, 28px); font-weight: 800; color: var(--gold-light);
    animation: popIn .5s ease both;
  }
  .done .small { display: block; margin-top: 8px; font-size: clamp(12px, 1.5vw, 15px); font-weight: 500; color: var(--muted); }

  /* 按钮 */
  .controls { margin-top: clamp(14px, 2.5vw, 26px); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit; font-size: clamp(13px, 1.7vw, 16px); font-weight: 700; letter-spacing: 1px;
    padding: 11px 26px; border-radius: 999px; border: none; cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .15s;
  }
  .btn:active { transform: scale(.95); }
  .btn-primary {
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color: #2a1a08; box-shadow: 0 8px 24px rgba(217,169,92,.35);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(217,169,92,.5); }
  .btn-ghost {
    background: transparent; color: var(--muted); border: 1px solid rgba(182,161,131,.45);
  }
  .btn-ghost:hover { color: var(--gold-light); border-color: var(--gold); }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px);} to { opacity:1; transform:none;} }
  @keyframes popIn { 0%{ opacity:0; transform: scale(.85);} 60%{ transform: scale(1.05);} 100%{ opacity:1; transform: scale(1);} }
  @keyframes flipPop { 0%{ transform: scale(1);} 45%{ transform: scale(1.06);} 100%{ transform: scale(1);} }
  .card.flipped .card-inner { animation: flipPop .7s ease; }

  /* 手机竖屏：2 列，保证问题可读 */
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .front .q { font-size: clamp(13px, 4vw, 17px); }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="sub">展科 · 新媒体 × AI</div>
    <h1>AI小白如何用AI变现</h1>
    <div class="hint">每人点一张牌，翻开说说你的答案 —— 大家边喝茶边聊</div>
  </div>

  <div class="progress">
    <span class="text">已翻开 <b id="cur">0</b> / <b id="total">10</b></span>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="done" id="done">
    十张牌都翻完啦 🍵
    <span class="small">今天聊的话题，可能就藏在这些答案里</span>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnReset">重新开始</button>
  </div>

<script>
  const CARDS = [
    "你手机里有几个AI软件？哪个用起来最惊喜？",
    "你最近一次用AI，是帮你干了件什么事？",
    "刷到过AI做的视频或图片吗？有没有被惊艳到？",
    "如果让AI帮你搞定一件最烦的事，那会是什么事？",
    "你有没有想过，用AI帮自己多赚点钱？",
    "你觉得AI会抢你饭碗，还是帮你？",
    "你身边有没有人，用AI混得不错的？",
    "如果每天给你一小时学AI，你最想学什么？",
    "如果现在就能多一份副业收入，你最想先试哪个方向？",
    "你心里最大的疑问：AI到底能不能真的赚到钱？"
  ];

  const grid = document.getElementById('grid');
  const curEl = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const barEl = document.getElementById('bar');
  const doneEl = document.getElementById('done');

  totalEl.textContent = CARDS.length;
  let flippedCount = 0;

  // 简单翻牌音效（Web Audio，无需外部文件）
  function playFlip() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) { /* 音效失败不影响使用 */ }
  }

  function updateProgress() {
    curEl.textContent = flippedCount;
    barEl.style.width = (flippedCount / CARDS.length * 100) + '%';
    if (flippedCount === CARDS.length) {
      doneEl.style.display = 'block';
    } else {
      doneEl.style.display = 'none';
    }
  }

  function buildCards() {
    grid.innerHTML = '';
    flippedCount = 0;
    CARDS.forEach((text, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.idx = i;
      card.innerHTML = `
        <div class="card-inner">
          <div class="face back">
            <div class="idx">${String(i + 1).padStart(2, '0')}</div>
            <div class="logo">AI 变现局</div>
          </div>
          <div class="face front">
            <div class="q-label">抽到这张的朋友，请回答</div>
            <div class="q">${text}</div>
            <div class="q-no">第 ${i + 1} 张</div>
          </div>
        </div>`;
      card.addEventListener('click', () => flipCard(card, i));
      grid.appendChild(card);
    });
    updateProgress();
  }

  function flipCard(card, i) {
    if (card.classList.contains('flipped')) return; // 已翻开的不能再翻
    card.classList.add('flipped');
    flippedCount++;
    playFlip();
    // 翻开瞬间金色闪光
    const front = card.querySelector('.front');
    front.classList.add('flash');
    setTimeout(() => front.classList.remove('flash'), 900);
    updateProgress();
  }

  function shuffle() {
    // 真洗牌：随机重排 DOM
    const cards = [...grid.children];
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    cards.forEach(c => grid.appendChild(c));
  }

  function reset() {
    flippedCount = 0;
    grid.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
    updateProgress();
    shuffle();
    playFlip();
  }

  document.getElementById('btnReset').addEventListener('click', reset);
  buildCards();
</script>
</body>
</html>
